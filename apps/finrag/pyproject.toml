[project]
name = "finrag"
version = "0.1.0"
description = "Enterprise RAG platform over SEC 10-K/10-Q filings: hybrid retrieval, reranking, cited answers, honest refusal, and an eval suite that gates merges."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "structlog>=25.1,<26",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "httpx>=0.28,<1",
    "pyright>=1.1.400,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.pyright]
typeCheckingMode = "basic"
pythonVersion = "3.12"
include = ["app", "evals", "tests"]
venvPath = "."
venv = ".venv"
